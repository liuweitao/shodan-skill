name: Dependabot auto-merge

on:
  workflow_dispatch:
  repository_dispatch:
    types: [maintenance-audit]
  pull_request:
    paths:
      - ".github/workflows/dependabot-automerge.yml"
      - ".github/maintenance-settings.json"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out PR code in this privileged workflow.
      - name: Verify Dependabot metadata and signed commits
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - name: Read effective branch protection
        if: &routine >-
          steps.metadata.outputs.maintainer-changes == 'false' &&
          (steps.metadata.outputs.package-ecosystem == 'pip' ||
           steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env: &protection-env
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        shell: python
        run: &read-protection |
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          prefix = "repos/" + os.environ["OWNER"] + "/" + os.environ["REPOSITORY"]
          def api(path):
              response = subprocess.run(["gh", "api", path], text=True, capture_output=True)
              if response.returncode:
                  raise SystemExit(response.stderr)
              return json.loads(response.stdout)

          repository = api(prefix)
          branch = quote(repository["default_branch"], safe="")
          rules = []
          for page in range(1, 101):
              batch = api(f"{prefix}/rules/branches/{branch}?per_page=100&page={page}")
              if not isinstance(batch, list):
                  raise SystemExit("Invalid active branch rules response")
              rules.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit("Active branch rules pagination exceeded the safety limit")
          ids = {rule.get("ruleset_id") for rule in rules if rule.get("ruleset_source_type") == "Repository"}
          if any(type(value) is not int or value <= 0 for value in ids):
              raise SystemExit("Invalid ruleset identifier")
          definitions = {str(value): api(f"{prefix}/rulesets/{value}") for value in sorted(ids)}
          Path(os.environ["RUNNER_TEMP"], "maintenance-protection.json").write_text(
              json.dumps({"repository": repository, "rules": rules, "rulesets": definitions})
          )
      - name: Require configured protection before queueing
        id: protection
        if: *routine
        shell: python
        run: &guard-protection |
          import json
          import os
          from pathlib import Path

          response = json.loads(Path(os.environ["RUNNER_TEMP"], "maintenance-protection.json").read_text())
          repository = response.get("repository") or {}
          definitions = response.get("rulesets") or {}
          eligible = {
              key for key, definition in definitions.items()
              if definition.get("target") == "branch"
              and definition.get("enforcement") == "active"
              and definition.get("bypass_actors") == []
          }
          rules = [
              rule for rule in response.get("rules", [])
              if rule.get("ruleset_source_type") == "Repository"
              and str(rule.get("ruleset_id")) in eligible
          ]
          expected = {
              "Required CI": 15368,
              "Build bilingual manual": 15368,
              "Analyze Python": 15368,
              "CodeQL": 57789,
          }
          strict_checks = False
          conversations = False
          for rule in rules:
              parameters = rule.get("parameters") or {}
              if rule.get("type") == "required_status_checks":
                  checks = {
                      item.get("context"): item.get("integration_id")
                      for item in parameters.get("required_status_checks", [])
                  }
                  strict_checks |= (
                      parameters.get("strict_required_status_checks_policy") is True
                      and parameters.get("do_not_enforce_on_create", False) is False
                      and all(checks.get(name) == app for name, app in expected.items())
                  )
              if rule.get("type") == "pull_request":
                  conversations |= parameters.get("required_review_thread_resolution") is True
          types = {rule.get("type") for rule in rules}
          required = (
              repository.get("allow_auto_merge") is True
              and strict_checks and conversations
              and {"deletion", "non_fast_forward"} <= types
          )
          if not required:
              raise SystemExit(
                  "Auto-merge refused: active no-bypass ruleset with strict required checks, "
                  "conversation resolution, deletion and force-push protection is missing or unreadable."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ready=true\n")
      - name: Queue routine update behind required checks
        if: steps.protection.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$EXPECTED_HEAD"

  audit:
    name: Audit maintenance protection
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read effective branch protection
        env: *protection-env
        shell: python
        run: *read-protection
      - name: Verify the same gate without queueing a merge
        shell: python
        run: *guard-protection
