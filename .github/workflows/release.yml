name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,release]"
      - run: python -m pip check
      - run: python -m pytest --cov=shodan_skill --cov-report=term-missing --cov-fail-under=90
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/shodan_skill
      - run: python scripts/verify_coverage.py --require-complete
      - run: python scripts/verify_skill.py
      - run: python scripts/verify_release.py
      - run: python scripts/build_bundles.py
      - run: git diff --exit-code -- platforms
      - run: python -m build
      - name: Verify release version
        run: python scripts/verify_release.py --tag "${{ github.ref_name }}"
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .product-venv
          .product-venv/bin/python -m pip install dist/*.whl
          .product-venv/bin/python -m pip check
          .product-venv/bin/shodan-skill --version
          .product-venv/bin/shodan-skill --help
      - name: Generate CycloneDX SBOM
        run: >-
          cyclonedx-py environment .product-venv/bin/python
          --spec-version 1.6
          --output-format JSON
          --output-reproducible
          --output-file dist/shodan-skill.cdx.json
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz ./*.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shodan-skill-release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shodan-skill-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/shodan-skill
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shodan-skill-python-distributions
          path: dist/
      - name: Publish the verified Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shodan-skill-release-artifacts
          path: dist/
      - name: Publish the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
