representation_notes:
  - The Streaming alert collection and alert-by-ID feeds are separate documented paths and therefore separate operations.
  - The Streaming custom heading includes query in the documentation, but query is represented as a required query parameter on /shodan/custom.
  - The official Python SDK exposes an undocumented tags stream; it is excluded because this manifest tracks current documented HTTP operations.
