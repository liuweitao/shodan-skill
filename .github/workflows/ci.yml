name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest --cov=shodan_skill --cov-report=term-missing --cov-fail-under=90
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/shodan_skill
      - run: python scripts/verify_coverage.py --require-complete
      - run: python scripts/verify_skill.py
      - run: python scripts/verify_manual.py
      - run: python scripts/verify_release.py
      - run: python scripts/build_bundles.py
      - run: git diff --exit-code -- platforms
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-python-distributions
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  release-smoke:
    name: Release dependency and SBOM smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-python-distributions
          path: dist/
      - run: python -m pip install ".[release]"
      - run: python -m pip check
      - name: Verify isolated wheel installation and SBOM generation
        run: |
          python -m venv .product-venv
          .product-venv/bin/python -m pip install dist/*.whl
          .product-venv/bin/python -m pip check
          .product-venv/bin/shodan-skill --version
          .product-venv/bin/shodan-skill --help
          cyclonedx-py environment .product-venv/bin/python --spec-version 1.6 --output-format JSON --output-reproducible --output-file dist/shodan-skill.cdx.json
          python scripts/verify_sbom.py dist/shodan-skill.cdx.json

  required:
    name: Required CI
    if: always()
    needs: [quality, compatibility, release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
