name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,release]"
      - run: python -m pip check
      - run: python -m pytest --cov=shodan_skill --cov-report=term-missing --cov-fail-under=90
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/shodan_skill
      - run: python scripts/verify_coverage.py --require-complete
      - run: python scripts/verify_skill.py
      - run: python scripts/verify_release.py
      - run: python scripts/build_bundles.py
      - run: git diff --exit-code -- platforms
      - run: python -m build
      - name: Verify release version
        run: python scripts/verify_release.py --tag "${{ github.ref_name }}"
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .product-venv
          .product-venv/bin/python -m pip install dist/*.whl
          .product-venv/bin/python -m pip check
          .product-venv/bin/shodan-skill --version
          .product-venv/bin/shodan-skill --help
      - name: Generate CycloneDX SBOM
        run: >-
          cyclonedx-py environment .product-venv/bin/python
          --spec-version 1.6
          --output-format JSON
          --output-reproducible
          --output-file dist/shodan-skill.cdx.json
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz *.json > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shodan-skill-release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - name: Publish the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
