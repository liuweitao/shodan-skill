[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "shodan-skill"
version = "2.0.1"
description = "Portable, safety-focused CLI for the documented Shodan APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "shodan-skill contributors"}]
keywords = ["shodan", "osint", "security", "agent-skill", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.28,<0.29",
]

[project.urls]
Homepage = "https://github.com/liuweitao/shodan-skill"
Documentation = "https://liuweitao.github.io/shodan-skill/"
Repository = "https://github.com/liuweitao/shodan-skill"
Issues = "https://github.com/liuweitao/shodan-skill/issues"
Security = "https://github.com/liuweitao/shodan-skill/security/policy"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<3",
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "setuptools>=77,<84",
  "wheel>=0.44,<1",
]
release = [
  "cyclonedx-bom>=7.3,<8",
]

[project.scripts]
shodan-skill = "shodan_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live: requires an explicitly authorized real Shodan API request",
  "credit: live test may consume Shodan query or scan credits",
  "mutating: live test changes Shodan account state",
  "enterprise: live test requires an entitled Enterprise account",
  "targeted: live test requires SHODAN_TEST_TARGETS with authorized targets",
]

[tool.coverage.run]
branch = true
source = ["shodan_skill"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "build", "dist", "platforms"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
external = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["shodan_skill"]

[[tool.mypy.overrides]]
module = "httpx"
ignore_missing_imports = true
