site_name: Shodan Skill
site_description: User guide for the unofficial, safety-focused Shodan CLI and Agent Skill
site_url: https://liuweitao.github.io/shodan-skill/
repo_url: https://github.com/liuweitao/shodan-skill
repo_name: liuweitao/shodan-skill
edit_uri: edit/master/manual/
docs_dir: manual
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 入门
            Quick start: 快速开始
            Installation and authentication: 安装与认证
            Core concepts: 核心概念
            Configuration and timeouts: 配置与超时
            Safety, credits, and access: 安全、积分与权限
            Output, errors, and redaction: 输出、错误与脱敏
            Guides: 使用指南
            Discovery and DNS: 主机发现与 DNS
            Scans: 扫描
            Alerts and notifiers: 告警与通知器
            Streaming: 实时数据流
            Trends and Exploits: Trends 与 Exploits
            Enterprise data and organizations: 企业数据与组织
            Agent platforms: Agent 平台
            Task recipes: 任务配方
            Troubleshooting: 故障排查
            Command reference: 命令速查

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quickstart.md
      - Installation and authentication: getting-started/installation.md
  - Core concepts:
      - Configuration and timeouts: concepts/configuration.md
      - Safety, credits, and access: concepts/safety.md
      - Output, errors, and redaction: concepts/output.md
  - Guides:
      - Discovery and DNS: guides/discovery.md
      - Scans: guides/scans.md
      - Alerts and notifiers: guides/alerts.md
      - Streaming: guides/streaming.md
      - Trends and Exploits: guides/secondary-services.md
      - Enterprise data and organizations: guides/enterprise.md
      - Agent platforms: guides/agents.md
  - Task recipes: recipes.md
  - Troubleshooting: troubleshooting.md
  - Command reference: reference/commands.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/liuweitao/shodan-skill
      name: Shodan Skill on GitHub

copyright: This unofficial project is not affiliated with, endorsed by, or sponsored by Shodan.
