name: Official documentation drift

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-documentation-drift
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Compare official docs and prepare review evidence
        id: snapshot
        run: |
          if python scripts/refresh_official_snapshot.py --check \
              --report "$RUNNER_TEMP/official-documentation-report.md" \
              --candidate-snapshot "$RUNNER_TEMP/official-api-snapshot.yaml"; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare only generated review changes
        if: steps.snapshot.outputs.drift == 'true'
        run: python scripts/prepare_snapshot_update.py "$RUNNER_TEMP/official-api-snapshot.yaml"
      - name: Create or update the documentation review PR
        if: steps.snapshot.outputs.drift == 'true'
        id: proposal
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: automation/official-documentation
          base: ${{ github.event.repository.default_branch }}
          commit-message: "docs: refresh official Shodan documentation snapshot"
          title: "docs: review official Shodan documentation changes"
          body-path: ${{ runner.temp }}/official-documentation-report.md
          add-paths: |
            references/official-api-snapshot.yaml
            references/api-coverage.yaml
            platforms/
      - name: Publish drift summary
        if: always()
        env:
          REVIEW_PR: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          if [ -f "$RUNNER_TEMP/official-documentation-report.md" ]; then
            cat "$RUNNER_TEMP/official-documentation-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REVIEW_PR" ]; then
            printf '\nReview PR: %s\n' "$REVIEW_PR" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate snapshot and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-documentation-review
          path: |
            ${{ runner.temp }}/official-documentation-report.md
            ${{ runner.temp }}/official-api-snapshot.yaml
          if-no-files-found: warn
          retention-days: 30
